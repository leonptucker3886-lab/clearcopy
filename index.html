<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClearCopy (beta) - Website Proofreading Desk</title><meta name="description" content="ClearCopy proofreads web pages for spelling, grammar, readability, SEO tags and affiliate disclosure placement."><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:1rem;background:#fafaf9;color:#18181b}.beta{background:#fde68a;padding:.5rem;border-radius:6px}input{width:65%;padding:.5rem}button{padding:.5rem 1rem}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}.high{color:#b91c1c}.med{color:#b45309}table{width:100%;border-collapse:collapse}td{border-top:1px solid #eee;padding:4px}</style></head><body>
<p class="beta">Beta v0.2. Not linked from LeonLink yet.</p>
<h1>ClearCopy</h1><p>Proofreads a page or a whole sitemap: spelling, repeated words, readability, title/meta/H1, and whether the affiliate disclosure comes <b>before</b> the first Amazon link.</p>
<div class="card"><label for="u">Page URL or sitemap.xml URL</label><br><input id="u" onkeydown="if(event.key==='Enter')go()" placeholder="https://www.leonlink.net/sitemap.xml"> <button id="b" onclick="go()">Check</button> <button onclick="csv()">Export CSV</button></div><div id="out"></div>
<script>
let last=null;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function go(){let v=u.value.trim();if(!v)return;if(!/^https?:\/\//i.test(v))v='https://'+v;b.disabled=true;out.textContent='Checking... (a sitemap can take up to 30 seconds)';
const p=/\.xml(\?|#|$)/i.test(v)?'sitemap':'url';try{const r=await fetch('/api/check?'+p+'='+encodeURIComponent(v)+'&limit=30');last=await r.json().catch(()=>({error:'Server error (HTTP '+r.status+'). Try again.'}));}catch(e){last={error:'Network error. Check your connection.'};}b.disabled=false;
if(last.error){out.textContent=last.error;last=null;return;}if(!last.results.length){out.textContent='No pages found in that sitemap.';return;}
out.innerHTML=last.results.map(x=>x.error?`<div class=card><b>${esc(x.url)}</b><br>Error: ${esc(x.error)}</div>`:`<div class=card><b>${esc(x.url)}</b> - score ${x.score}/100, ${x.wordCount} words, reading grade ${x.readingGrade??'n/a'}<table>${x.issues.map(i=>`<tr><td class=${i.sev}>${i.sev}</td><td>${i.type}</td><td>${esc(i.msg)}</td><td>${esc(i.fix)}</td></tr>`).join('')||'<tr><td>No issues found</td></tr>'}</table></div>`).join('');}
function csv(){if(!last)return;const r=[['url','severity','type','issue','fix']];last.results.forEach(x=>(x.issues||[]).forEach(i=>r.push([x.url,i.sev,i.type,i.msg,i.fix])));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='clearcopy.csv';a.click();}
</script></body></html>
